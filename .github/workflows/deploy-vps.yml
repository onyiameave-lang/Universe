name: Deploy Oracle Trader to VPS

on:
  push:
    branches: [oracle-v1]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: oracle-vps-production
  cancel-in-progress: false

env:
  PYTHON_VERSION: "3.11"

jobs:
  verify:
    name: Verify release
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip

      - name: Install test dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install pytest python-dotenv

      - name: Compile changed runtime modules
        run: |
          python -m py_compile \
            shared/trading_runtime.py \
            Oracle/execution/trade_manager.py \
            Oracle/execution/ctrader_demo_trader.py \
            Oracle/execution/live_trader.py \
            Oracle/execution/mt5_demo_trader.py \
            Oracle/execution/ctrader_broker.py \
            Oracle/execution/mt5_broker.py

      - name: Run tests
        run: |
          set +e
          python -m pytest -q \
            --ignore=quick_test.py \
            --ignore=Oracle/tools/test_ctrader.py \
            --ignore=Oracle/tools/test_ctrader_trade.py
          status=$?
          set -e

          # pytest returns 5 when this repository has no collected tests.
          # Compilation and runtime policy checks above still remain required.
          if [ "$status" -ne 0 ] && [ "$status" -ne 5 ]; then
            exit "$status"
          fi

  deploy:
    name: Deploy to VPS
    needs: verify
    runs-on: ubuntu-latest
    environment: production
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Load deployment SSH key
        uses: webfactory/ssh-agent@v0.9.0
        with:
          ssh-private-key: ${{ secrets.VPS_SSH_PRIVATE_KEY }}

      - name: Install VPS host key
        run: |
          mkdir -p "$HOME/.ssh"
          printf '%s\n' '${{ secrets.VPS_KNOWN_HOSTS }}' > "$HOME/.ssh/known_hosts"
          chmod 600 "$HOME/.ssh/known_hosts"

      - name: Deploy, restart, and verify
        env:
          VPS_HOST: ${{ secrets.VPS_HOST }}
          VPS_USER: ${{ secrets.VPS_USER }}
          VPS_REPO_DIR: ${{ secrets.VPS_REPO_DIR }}
          VPS_SERVICE: oracle-ctrader
          DEPLOY_BRANCH: oracle-v1
          RELEASE_SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          : "${VPS_HOST:?Missing VPS_HOST secret}"
          : "${VPS_USER:?Missing VPS_USER secret}"
          : "${VPS_REPO_DIR:?Missing VPS_REPO_DIR secret}"

          ssh -o BatchMode=yes -o StrictHostKeyChecking=yes \
            "${VPS_USER}@${VPS_HOST}" \
            "VPS_REPO_DIR='${VPS_REPO_DIR}' VPS_SERVICE='${VPS_SERVICE}' DEPLOY_BRANCH='${DEPLOY_BRANCH}' RELEASE_SHA='${RELEASE_SHA}' bash -s" <<'REMOTE'
          set -euo pipefail

          cd "$VPS_REPO_DIR"
          previous_sha="$(git rev-parse HEAD)"

          rollback() {
            trap - ERR
            echo "Deployment failed; restoring ${previous_sha}"
            git reset --hard "$previous_sha"
            sudo -n systemctl reset-failed "$VPS_SERVICE"
            sudo -n systemctl restart "$VPS_SERVICE"
            sudo -n systemctl is-active --quiet "$VPS_SERVICE"
          }

          trap rollback ERR

          git fetch --prune origin "$DEPLOY_BRANCH"
          git reset --hard "$RELEASE_SHA"

          # Keep credentials and runtime state on the VPS. They are never
          # overwritten by GitHub Actions and are excluded from repository sync.
          test -f Oracle/.env

          # Keep the existing VPS environment aligned with the checked-in
          # runtime dependencies before restarting the trader.
          test -x "$VPS_REPO_DIR/Oracle/venv/bin/pip"
          "$VPS_REPO_DIR/Oracle/venv/bin/pip" install --disable-pip-version-check \
            --requirement requirements.txt

          python3 -m py_compile \
            shared/trading_runtime.py \
            Oracle/execution/trade_manager.py \
            Oracle/execution/ctrader_demo_trader.py \
            Oracle/execution/live_trader.py \
            Oracle/execution/mt5_demo_trader.py \
            Oracle/execution/ctrader_broker.py \
            Oracle/execution/mt5_broker.py

          # Clear a prior crash-loop start limit before launching the repaired service.
          sudo -n systemctl reset-failed "$VPS_SERVICE"
          sudo -n systemctl restart "$VPS_SERVICE"
          sudo -n systemctl is-active --quiet "$VPS_SERVICE"

          trap - ERR
          echo "Deployment verified: ${RELEASE_SHA}"
          REMOTE
