name: Oracle Forge Research Review

on:
  workflow_dispatch:
    inputs:
      symbol:
        description: Oracle symbol to review
        required: true
        default: EURUSD
      experiment_type:
        description: Run a challenger comparison or one module ablation
        type: choice
        options:
          - challenger
          - ablation
        required: true
        default: challenger
      ablation_target:
        description: Required for ablation runs
        type: choice
        options:
          - trend
          - momentum
          - volatility
          - entry
          - exit
          - risk
          - position
          - trade_management
          - market_regime
        required: false
  schedule:
    # Monthly cadence limits repeated peeking while this remains research-only.
    - cron: "17 6 1 * *"

permissions:
  contents: write

concurrency:
  group: oracle-forge-research
  cancel-in-progress: false

jobs:
  research-review:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Check out Oracle V2 research branch
        uses: actions/checkout@v4
        with:
          ref: oracle-v2
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: requirements.txt

      - name: Install runtime dependencies
        run: python -m pip install --upgrade pip && python -m pip install -r requirements.txt

      - name: Start API for read-only Oracle to Forge review
        shell: bash
        env:
          CTRADER_CLIENT_ID: ${{ secrets.CTRADER_CLIENT_ID }}
          CTRADER_CLIENT_SECRET: ${{ secrets.CTRADER_CLIENT_SECRET }}
          CTRADER_ACCESS_TOKEN: ${{ secrets.CTRADER_ACCESS_TOKEN }}
          CTRADER_ACCOUNT_ID: ${{ secrets.CTRADER_ACCOUNT_ID }}
          CTRADER_USE_DEMO: "true"
          ORACLE_FORGE_COST_PROFILES_JSON: ${{ secrets.ORACLE_FORGE_COST_PROFILES_JSON }}
          ORACLE_FORGE_MINIMUM_EXECUTED_TRADES: "100"
        run: |
          python api.py > /tmp/oracle-forge-api.log 2>&1 &
          echo $! > /tmp/oracle-forge-api.pid
          for attempt in $(seq 1 90); do
            if curl --fail --silent http://127.0.0.1:8000/health >/dev/null; then
              exit 0
            fi
            sleep 2
          done
          cat /tmp/oracle-forge-api.log
          exit 1

      - name: Run bounded research review
        env:
          ORACLE_FORGE_SYMBOL: ${{ inputs.symbol || 'EURUSD' }}
          ORACLE_FORGE_EXPERIMENT_TYPE: ${{ inputs.experiment_type || 'challenger' }}
          ORACLE_FORGE_ABLATION_TARGET: ${{ inputs.ablation_target || '' }}
        run: python Oracle/tools/forge_experiment_runner.py

      - name: Stop API
        if: always()
        run: if [ -f /tmp/oracle-forge-api.pid ]; then kill "$(cat /tmp/oracle-forge-api.pid)" || true; fi

      - name: Commit report to oracle-v2
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir -p Forge/reports/oracle_experiments
          git config user.name "oracle-forge-research-bot"
          git config user.email "actions@users.noreply.github.com"
          git add Forge/reports/oracle_experiments/
          if ! git diff --cached --quiet; then
            git commit -m "Forge Oracle research report $(date -u +'%Y-%m-%d %H:%M UTC')"
            git push origin HEAD:oracle-v2
          fi
