name: Oracle Forge Research Review

on:
  workflow_dispatch:
    inputs:
      symbol:
        description: Oracle symbol(s); focused research defaults to EURUSD (ALL uses the full watchlist)
        required: true
        default: EURUSD
      experiment_type:
        description: Select a mode, or AUTO to use the scheduled six-hour rotation
        type: choice
        options:
          - auto
          - challenger
          - ablation
          - drift
          - cost-observations
        required: true
        default: auto
      ablation_target:
        description: Required for ablation runs
        type: choice
        options:
          - trend
          - momentum
          - volatility
          - entry
          - exit
          - risk
          - position
          - trade_management
          - market_regime
        required: false
      collect_empirical_costs:
        description: Collect cTrader fill and quote evidence for the selected symbol(s)
        type: boolean
        required: true
        default: true
  schedule:
    - cron: "0 */6 * * *"

permissions:
  contents: write

concurrency:
  group: oracle-forge-research
  cancel-in-progress: false

jobs:
  research-review:
    runs-on: ubuntu-latest
    timeout-minutes: 350
    steps:
      - name: Check out Oracle V2 research branch
        uses: actions/checkout@v4
        with:
          ref: oracle-v2
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: requirements.txt

      - name: Install runtime dependencies
        run: python -m pip install --upgrade pip && python -m pip install -r requirements.txt

      - name: Restore Forge Oracle state from Chronicle snapshot
        id: restore_chronicle
        run: python Chronicle/tools/forge_oracle_state_snapshot.py restore

      - name: Start API for read-only Oracle to Forge review
        id: start_api
        shell: bash
        env:
          CTRADER_CLIENT_ID: ${{ secrets.CTRADER_CLIENT_ID }}
          CTRADER_CLIENT_SECRET: ${{ secrets.CTRADER_CLIENT_SECRET }}
          CTRADER_ACCESS_TOKEN: ${{ secrets.CTRADER_ACCESS_TOKEN }}
          CTRADER_ACCOUNT_ID: ${{ secrets.CTRADER_ACCOUNT_ID }}
          CTRADER_USE_DEMO: "true"
          ORACLE_FORGE_MINIMUM_EXECUTED_TRADES: "100"
          ORACLE_FORGE_COST_WINDOW_HOURS: "6"
          ORACLE_FORGE_TICK_CHUNK_MINUTES: "15"
          ORACLE_FORGE_MINIMUM_COST_QUOTES: "100"
          ORACLE_FORGE_MINIMUM_COST_DEALS: "20"
          ORACLE_FORGE_MAXIMUM_SLIPPAGE_DEALS: "100"
          ORACLE_FORGE_DEAL_HISTORY_DAYS: "1827"
        run: |
          missing_secrets=()
          [[ -n "$CTRADER_CLIENT_ID" ]] || missing_secrets+=(CTRADER_CLIENT_ID)
          [[ -n "$CTRADER_CLIENT_SECRET" ]] || missing_secrets+=(CTRADER_CLIENT_SECRET)
          [[ -n "$CTRADER_ACCESS_TOKEN" ]] || missing_secrets+=(CTRADER_ACCESS_TOKEN)
          [[ -n "$CTRADER_ACCOUNT_ID" ]] || missing_secrets+=(CTRADER_ACCOUNT_ID)
          if ((${#missing_secrets[@]})); then
            echo "Missing GitHub Actions secrets: ${missing_secrets[*]}"
            echo "Add them as repository secrets, or bind the job to the GitHub Environment that contains them."
            exit 1
          fi
          python api.py > /tmp/oracle-forge-api.log 2>&1 &
          echo $! > /tmp/oracle-forge-api.pid
          for attempt in $(seq 1 90); do
            if health="$(curl --fail --silent http://127.0.0.1:8000/health)"; then
              if python -c 'import json,sys; d=json.load(sys.stdin); sys.exit(0 if "oracle" in d.get("active_agents", []) else 1)' <<< "$health"; then
                exit 0
              fi
              echo "API is responding, but Oracle did not initialize; refusing to run a misleading research cycle."
              cat /tmp/oracle-forge-api.log
              exit 1
            fi
            sleep 2
          done
          cat /tmp/oracle-forge-api.log
          exit 1

      - name: Run bounded research review
        env:
          ORACLE_FORGE_SYMBOLS: ${{ inputs.symbol || 'EURUSD' }}
          ORACLE_FORGE_EXPERIMENT_TYPE: ${{ inputs.experiment_type || 'auto' }}
          ORACLE_FORGE_ABLATION_TARGET: ${{ inputs.ablation_target || '' }}
          ORACLE_FORGE_COLLECT_EMPIRICAL_COSTS: ${{ github.event_name == 'schedule' && 'true' || inputs.collect_empirical_costs }}
        run: python Oracle/tools/forge_experiment_runner.py

      - name: Stop API
        if: always()
        shell: bash
        run: |
          if [[ -f /tmp/oracle-forge-api.pid ]]; then
            api_pid="$(cat /tmp/oracle-forge-api.pid)"
            kill "$api_pid" 2>/dev/null || true
            for attempt in $(seq 1 60); do
              if ! kill -0 "$api_pid" 2>/dev/null; then
                exit 0
              fi
              sleep 1
            done
            echo "API did not stop cleanly; terminating it before state export."
            kill -KILL "$api_pid" 2>/dev/null || true
          fi

      - name: Save Forge Oracle state to Chronicle snapshot
        if: always() && steps.restore_chronicle.outcome == 'success' && steps.start_api.outcome == 'success'
        run: python Chronicle/tools/forge_oracle_state_snapshot.py export

      - name: Commit report to oracle-v2
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          git config user.name "oracle-forge-research-bot"
          git config user.email "actions@users.noreply.github.com"
          if [[ -f Chronicle/memory/research/oracle_state/forge_oracle_state.json ]]; then
            git add Chronicle/memory/research/oracle_state/forge_oracle_state.json
          fi
          mkdir -p Chronicle/memory/research/oracle_forge_experiments Chronicle/memory/research/oracle_strategy_catalogs Chronicle/memory/research/oracle_market_data Chronicle/memory/research/oracle_cost_profiles Chronicle/memory/research/oracle_ablation_learning Chronicle/memory/research/oracle_state
          git add Chronicle/memory/research/oracle_forge_experiments/ Chronicle/memory/research/oracle_strategy_catalogs/ Chronicle/memory/research/oracle_market_data/ Chronicle/memory/research/oracle_cost_profiles/ Chronicle/memory/research/oracle_ablation_learning/ Chronicle/memory/research/oracle_state/
          if ! git diff --cached --quiet; then
            git commit -m "Forge Oracle research report $(date -u +'%Y-%m-%d %H:%M UTC')"
            git push origin HEAD:oracle-v2
          fi
